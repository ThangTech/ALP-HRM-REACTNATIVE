stages:
  - test
  - notify-test
  - ship

default:
  tags:
    - test-runner

variables:
  GIT_DEPTH: 20

# ============ ANCHOR: TELEGRAM NOTIFY ============
.notify_telegram: &notify_telegram
  - echo "DEBUG TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
  - echo "DEBUG TELEGRAM_TOKEN=${TELEGRAM_TOKEN}"
  - |
    DISPLAY_ENV="${TARGET_ENV}"
    if [ "$TARGET_ENV" = "N/A" ]; then
      DISPLAY_ENV="Push/MR Mode"
    fi
    MESSAGE="${STATUS_ICON} *React Native CI/CD Report*

    📱 *Project:* \`${CI_PROJECT_PATH}\`
    🛠 *Pipeline:* \`#${CI_PIPELINE_ID}\`
    💻 *Job:* \`${CI_JOB_NAME}\`
    🌿 *Branch:* \`${CI_COMMIT_REF_NAME}\`
    👤 *Actor:* \`${GITLAB_USER_LOGIN}\`

    📍 *Environment:* \`${DISPLAY_ENV}\`
    📊 *Status:* ${STATUS_TEXT}

    🔗 [View detail on GitLab](${CI_JOB_URL})"
    curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
      -d chat_id="${TELEGRAM_CHAT_ID}" \
      -d parse_mode="Markdown" \
      --data-urlencode text="${MESSAGE}"

# ============ ANCHOR: SHIP EAS BASE ============
.ship_eas_base: &ship_eas_base
  stage: ship
  image: node:20
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache/
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
    - npm install -g eas-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        STATUS_ICON="✅"
        STATUS_TEXT="SHIP SUCCESS"
      else
        STATUS_ICON="❌"
        STATUS_TEXT="SHIP FAILED"
      fi
    - *notify_telegram

# ============ STAGE: TEST ============
test-and-lint:
  image: node:20
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache/
  before_script:
    - corepack enable
    - yarn install --frozen-lockfile
  stage: test
  script:
    - yarn lint
    - yarn test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ============ STAGE: NOTIFY TEST ============
notify-test-success:
  stage: notify-test
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: none
  needs: ["test-and-lint"]
  when: on_success
  script:
    - STATUS_ICON="✅"; STATUS_TEXT="TEST SUCCESS"; TARGET_ENV="N/A"
    - *notify_telegram

notify-test-failure:
  stage: notify-test
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: none
  needs: ["test-and-lint"]
  when: on_failure
  script:
    - STATUS_ICON="❌"; STATUS_TEXT="TEST FAILED"; TARGET_ENV="N/A"
    - *notify_telegram

# ============ STAGE: SHIP ============
ship-eas-android-dev:
  <<: *ship_eas_base
  variables:
    TARGET_ENV: "Android Dev"
  script:
    - yarn update-android-dev --message "$CI_COMMIT_TITLE"

ship-eas-android-prod:
  <<: *ship_eas_base
  variables:
    TARGET_ENV: "Android Prod"
  script:
    - yarn update-android-prod --message "$CI_COMMIT_TITLE"

ship-eas-ios-dev:
  <<: *ship_eas_base
  variables:
    TARGET_ENV: "iOS Dev"
  script:
    - yarn update-ios-dev --message "$CI_COMMIT_TITLE"

ship-eas-ios-prod:
  <<: *ship_eas_base
  variables:
    TARGET_ENV: "iOS Prod"
  script:
    - yarn update-ios-prod --message "$CI_COMMIT_TITLE"