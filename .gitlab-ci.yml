stages:
  - test
  - ship
  - notify

default:
  tags:
    - test-runner

variables:
  GIT_DEPTH: 20

# # ============ ANCHOR: SHIP BASE ============
# .ship_android_base: &ship_android_base
#   stage: ship
#   image: reactnativecommunity/react-native-android:latest
#   cache:
#     key:
