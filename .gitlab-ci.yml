#         - yarn.lock
#     paths:
#       - .yarn-cache/
#   before_script:
#     - yarn config set cache-folder .yarn-cache
#     - yarn install --frozen-lockfile
#     - cp $GOOGLE_SERVICES_JSON android/app/google-services.json
#     - npm install -g firebase-tools
#   when: manual

# ============ ANCHOR: NOTIFY BASE ============
.notify_base: &notify_base
  stage: notify
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: none

# ============ STAGE: TEST ============
test-and-lint:
  image: node:18
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn-cache/
  before_script:
    - yarn config set cache-folder .yarn-cache
    - yarn install --frozen-lockfile
  stage: test
  script:
    - yarn lint
    - yarn test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# # ============ STAGE: SHIP (BUILD + DEPLOY) ============
