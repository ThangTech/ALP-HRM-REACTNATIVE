name: React Native CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Chọn môi trường Code Push'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  test-and-lint:
    name: Run Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure Git before npm install
        run: |
          git config --global core.autocrlf false
          git config --global --add safe.directory '*'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Run Jest Tests
        run: yarn test

  code-push-dev:
    name: Code Push Dev
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env == 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Tools cache
        id: tool-caches
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/revopush
          key: revopush-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            revopush-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Revopush CLI
        uses: 'revopush/revopush-github-action@v1.0.0'
        id: setup-revopush-cli
        with:
          version: 'latest'
          accessKey: ${{ secrets.GH_REVOPUSH_ACCESS_KEY }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create .env.local file
        run: echo "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Code Push Dev
        run: APP_ENV=development ./scripts/code-push.sh android

  code-push-prod:
    name: Code Push Prod
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Tools cache
        id: tool-caches
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/revopush
          key: revopush-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            revopush-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Revopush CLI
        uses: 'revopush/revopush-github-action@v1.0.0'
        id: setup-revopush-cli
        with:
          version: 'latest'
          accessKey: ${{ secrets.GH_REVOPUSH_ACCESS_KEY }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create .env.production.local file
        run: echo "${{ secrets.ENV_PROD_LOCAL }}" > .env.production.local

      - name: Code Push Prod
        run: APP_ENV=production ./scripts/code-push.sh android

